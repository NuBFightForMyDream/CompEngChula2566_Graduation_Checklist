name: CI
on:
  push:
    branches: [main, restructure, firebase]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @cp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # เก็บ trace ไว้ดูสาเหตุ เมื่อ E2E ตกแบบไม่สม่ำเสมอ ข้อมูลใน test เป็นข้อมูลสมมติทั้งหมด
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-web
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # รัน E2E ชุดเดิมพร้อมชุดบัญชี กับ Firebase Emulator และ firestore.rules ตัวจริง
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Firestore Emulator รันบน Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:firebase
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-firebase
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python checklist runs on the real curriculum
        run: python3 learning/python/cp52_checklist_graduation.py --passed 2110101 --why 2110327
      # แบบฝึก C++ ขึ้น FAIL ได้ตามปกติจนกว่าจะเติม TODO จึงตรวจแค่ว่าคอมไพล์ผ่าน
      - name: C++ exercises compile
        run: for f in learning/cpp/step*.cpp; do g++ -std=c++17 -Wall -fsyntax-only "$f"; done
