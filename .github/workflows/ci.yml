name: CI
on:
  push:
    branches: [main, restructure]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @cp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # เก็บ trace ไว้ดูสาเหตุ เมื่อ E2E ตกแบบไม่สม่ำเสมอ ข้อมูลใน test เป็นข้อมูลสมมติทั้งหมด
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-web
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # เว็บโหลดหลักสูตรผ่าน API และ Postgres จริง โดยรัน E2E ชุดเดียวกัน
  full-stack:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cp
          POSTGRES_PASSWORD: cp_dev_only
          POSTGRES_DB: cp_roadmap
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U cp -d cp_roadmap"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup
      - run: pnpm --filter @cp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_API: "1"
      # เก็บ trace ไว้ดูสาเหตุ เมื่อ E2E ตกแบบไม่สม่ำเสมอ ข้อมูลใน test เป็นข้อมูลสมมติทั้งหมด
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-full-stack
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # สร้าง Docker image จริง แล้วรัน E2E กับ image นั้น เพื่อยืนยันว่าสิ่งที่จะ deploy ใช้งานได้
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:image
      # เก็บ trace ไว้ดูสาเหตุ เมื่อ E2E ตกแบบไม่สม่ำเสมอ ข้อมูลใน test เป็นข้อมูลสมมติทั้งหมด
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-image
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python checklist runs on the real curriculum
        run: python3 learning/python/cp52_checklist_graduation.py --passed 2110101 --why 2110327
      # แบบฝึก C++ ขึ้น FAIL ได้ตามปกติจนกว่าจะเติม TODO จึงตรวจแค่ว่าคอมไพล์ผ่าน
      - name: C++ exercises compile
        run: for f in learning/cpp/step*.cpp; do g++ -std=c++17 -Wall -fsyntax-only "$f"; done
