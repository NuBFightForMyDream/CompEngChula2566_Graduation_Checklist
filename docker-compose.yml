# ฐานข้อมูลสำหรับพัฒนาในเครื่องเท่านั้น รหัสผ่านนี้ไม่ใช้กับระบบจริง
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cp
      POSTGRES_PASSWORD: cp_dev_only
      POSTGRES_DB: cp_roadmap
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cp -d cp_roadmap"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
