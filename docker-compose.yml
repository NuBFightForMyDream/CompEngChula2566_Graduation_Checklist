# ฐานข้อมูลสำหรับพัฒนาในเครื่องเท่านั้น รหัสผ่านนี้ไม่ใช้กับระบบจริง
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cp
      POSTGRES_PASSWORD: cp_dev_only
      POSTGRES_DB: cp_roadmap
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cp -d cp_roadmap"]
      interval: 2s
      timeout: 3s
      retries: 20

  # image ตัวเดียวกับที่จะ deploy ใช้ทดสอบในเครื่องด้วย pnpm image:up ไม่ได้เปิดตอน pnpm db:up
  app:
    profiles: [image]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cp:cp_dev_only@db:5432/cp_roadmap
      PUBLIC_ORIGIN: http://localhost:8090
    ports:
      - "127.0.0.1:8090:8080"

volumes:
  db-data:
